<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ray MB66 - Professional Tools</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at center, #1e293b, #0f172a); 
            color: #f8fafc; padding: 20px; margin: 0; min-height: 100vh; 
            cursor: none; 
        }
        .container { max-width: 1100px; margin: auto; position: relative; z-index: 10; }
        h2 { text-align: center; color: #60a5fa; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); }
        
        /* Tab System */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .tab-btn { padding: 12px 25px; cursor: pointer; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #3b82f6; color: white; border-color: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        .content { display: none; animation: fadeIn 0.3s; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: rgba(30, 41, 59, 0.8); padding: 20px; border-radius: 15px; border: 1px solid #334155; backdrop-filter: blur(5px); }
        label { color: #94a3b8; font-size: 13px; font-weight: bold; margin-bottom: 8px; display: block; text-transform: uppercase; }
        
        textarea { 
            width: 100%; height: 200px; background: #0f172a; border: 1px solid #475569; 
            color: #60a5fa; border-radius: 10px; padding: 15px; box-sizing: border-box; 
            outline: none; font-family: 'Courier New', monospace; font-size: 14px; cursor: text;
        }

        .btn-box { text-align: center; margin: 20px 0; display: flex; justify-content: center; gap: 15px; }
        button { padding: 12px 30px; cursor: pointer; border: none; border-radius: 50px; font-weight: bold; text-transform: uppercase; transition: 0.3s; font-size: 14px; }
        .btn-main { background: linear-gradient(45deg, #3b82f6, #2563eb); color: white; }
        .btn-del { background: #475569; color: #f8fafc; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }

        .res-container { display: flex; gap: 20px; margin-top: 20px; }
        .res-column { flex: 1; }
        .res-box { 
            background: rgba(15, 23, 42, 0.9); padding: 15px; border-radius: 10px; 
            min-height: 150px; color: #e2e8f0; font-family: monospace; white-space: pre-wrap; font-size: 14px;
        }
        .valid { border-left: 5px solid #10b981; }
        .invalid { border-left: 5px solid #ef4444; color: #f87171; }

        .particle { position: fixed; pointer-events: none; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #3b82f6; animation: moveParticle 1s forwards; z-index: 9999; }
        @keyframes moveParticle { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h2>RAY MB66 - MAGIC TOOLS</h2>

    <div class="tabs">
        <div class="tab-btn active" onclick="switchTab(event, 'bank-tab')">Trích xuất mã Bank</div>
        <div class="tab-btn" onclick="switchTab(event, 'compare-tab')">So sánh 2 cột</div>
    </div>

    <div id="bank-tab" class="content active">
        <div class="card">
            <label>Dán nội dung sao kê:</label>
            <textarea id="inputBank" placeholder="Dán nội dung sao kê tại đây..."></textarea>
            
            <div class="btn-box">
                <button class="btn-main" onclick="processBank()">Lọc mã nâng cao</button>
                <button class="btn-del" onclick="clearData('inputBank', ['validRes', 'invalidRes'])">Xóa dữ liệu</button>
            </div>

            <div class="res-container">
                <div class="res-column">
                    <label style="color: #10b981;">✅ MÃ ĐÚNG ĐIỀU KIỆN:</label>
                    <div id="validRes" class="res-box valid"></div>
                </div>
                <div class="res-column">
                    <label style="color: #f87171;">❌ MÃ THIẾU KÝ TỰ:</label>
                    <div id="invalidRes" class="res-box invalid"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="compare-tab" class="content">
        <div class="card">
            <div style="display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <label>Danh sách A:</label>
                    <textarea id="listA" placeholder="Nhập cột A..."></textarea>
                </div>
                <div style="flex: 1;">
                    <label>Danh sách B:</label>
                    <textarea id="listB" placeholder="Nhập cột B..."></textarea>
                </div>
            </div>

            <div class="btn-box">
                <button class="btn-main" onclick="processCompare()">So sánh khác biệt</button>
                <button class="btn-del" onclick="clearCompare()">Xóa dữ liệu</button>
            </div>

            <div class="res-container">
                <div class="res-column">
                    <label style="color: #60a5fa;">Chỉ có ở A:</label>
                    <div id="resA" class="res-box" style="border-left: 5px solid #3b82f6;"></div>
                </div>
                <div class="res-column">
                    <label style="color: #a78bfa;">Chỉ có ở B:</label>
                    <div id="resB" class="res-box" style="border-left: 5px solid #8b5cf6;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function switchTab(e, id) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }

    // Logic lọc mã ngân hàng theo điều kiện bạn yêu cầu
    function processBank() {
        const text = document.getElementById('inputBank').value.toUpperCase();
        const rules = [
            { key: "CHUYEN KHOAN", len: 6 },
            { key: "KHOAN", len: 6, exclude: "CHUYEN" },
            { key: "MAT", len: 5 },
            { key: "TIEN", len: 6 }
        ];

        let validList = [];
        let invalidList = [];

        rules.forEach(rule => {
            let regex = new RegExp(rule.key + "\\s?([A-Z0-9]+)", "gi");
            let match;

            while ((match = regex.exec(text)) !== null) {
                let fullMatch = match[0].trim();
                let codePart = match[1].trim();
                
                // Loại trừ KHOAN nếu có CHUYEN đằng trước
                if (rule.exclude) {
                    let preText = text.substring(match.index - 7, match.index);
                    if (preText.includes(rule.exclude)) continue;
                }

                if (codePart.length === rule.len) {
                    validList.push(fullMatch);
                } else {
                    invalidList.push(fullMatch);
                }
            }
        });

        document.getElementById('validRes').innerText = [...new Set(validList)].join('\n');
        document.getElementById('invalidRes').innerText = [...new Set(invalidList)].join('\n');
    }

    function processCompare() {
        const a = document.getElementById('listA').value.split('\n').map(s => s.trim()).filter(Boolean);
        const b = document.getElementById('listB').value.split('\n').map(s => s.trim()).filter(Boolean);
        document.getElementById('resA').innerText = a.filter(x => !b.includes(x)).join('\n');
        document.getElementById('resB').innerText = b.filter(x => !a.includes(x)).join('\n');
    }

    function clearData(inId, outIds) {
        document.getElementById(inId).value = "";
        outIds.forEach(id => document.getElementById(id).innerText = "");
    }

    function clearCompare() {
        ['listA', 'listB', 'resA', 'resB'].forEach(id => {
            let el = document.getElementById(id);
            if(el.tagName === "TEXTAREA") el.value = ""; else el.innerText = "";
        });
    }

    // Hiệu ứng hạt
    document.addEventListener('mousemove', (e) => {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
        const s = Math.random() * 5 + 2 + 'px';
        p.style.width = s; p.style.height = s;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
    });
</script>
</body>
</html>
