<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ray MB66 - MAGIC TOOLS V6.5 GALAXY FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #050810; --panel: rgba(22, 30, 45, 0.95); --primary: #3b82f6;
            --accent: #6366f1; --green: #10b981; --red: #f43f5e; --yellow: #f59e0b;
            --pink: #ec4899; --text: #f3f4f6;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow: hidden; cursor: crosshair; height: 100vh; position: relative; }

        /* --- 1. HIỆU ỨNG MƯA SAO BĂNG NỀN --- */
        #sky-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); overflow: hidden; }
        .shooting-star { position: absolute; left: 50%; top: 50%; height: 2px; background: linear-gradient(-45deg, #5f91ff, rgba(0, 0, 255, 0)); border-radius: 999px; filter: drop-shadow(0 0 6px #699bff); animation: tail 3s ease-in-out infinite, shooting 3s ease-in-out infinite; }
        @keyframes tail { 0% { width: 0; } 30% { width: 100px; } 100% { width: 0; } }
        @keyframes shooting { 0% { transform: rotateZ(45deg) translateX(0); } 100% { transform: rotateZ(45deg) translateX(1000px); } }
        
        /* --- 2. HIỆU ỨNG SAO THEO CHUỘT --- */
        .mouse-spark { position: fixed; width: 4px; height: 4px; border-radius: 50%; pointer-events: none; z-index: 9999; animation: fadeOut 0.8s ease-out forwards; }
        @keyframes fadeOut { 0% { opacity: 1; transform: scale(1.5) translateY(0); } 100% { opacity: 0; transform: scale(0.1) translateY(20px); } }

        /* Layout Main */
        .main-wrapper { height: 100vh; overflow-y: auto; padding: 20px; box-sizing: border-box; position: relative; z-index: 1; }
        .container { max-width: 1300px; margin: 0 auto; background: var(--panel); padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(15px); }

        .header-title { text-align: center; margin-bottom: 20px; }
        .header-title h1 { font-family: 'Great Vibes', cursive; font-size: 65px; background: linear-gradient(to bottom, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        
        .nav-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 35px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-weight: 800; background: rgba(17, 24, 39, 0.8); color: #94a3b8; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }

        .search-area { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.5); padding: 12px 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2d3748; }
        .search-area input { flex: 1; background: transparent; border: none; color: #60a5fa; outline: none; font-weight: bold; }
        
        textarea { width: 100%; min-height: 160px; background: #0a0e17; border: 1px solid #2d3748; border-radius: 12px; color: #e2e8f0; padding: 15px; font-family: 'JetBrains Mono'; resize: none; }
        
        .button-row { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
        button { padding: 12px 25px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-run { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
        .btn-clear { background: #1f2937; color: #aaa; }

        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .box { background: rgba(10, 14, 23, 0.8); border-radius: 16px; height: 350px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05); }
        .box-h { padding: 12px 15px; font-weight: 800; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,.05); }
        .box-b { flex: 1; padding: 12px; overflow-y: auto; font-family: 'JetBrains Mono'; font-size: 11px; white-space: pre-wrap; color: #cbd5e1; }
        
        .hidden { display: none !important; }
        #summaryStats { margin-bottom: 15px; padding: 12px; border-radius: 10px; background: rgba(59, 130, 246, 0.1); border: 1px solid var(--primary); font-weight: 800; font-size: 12px; text-align: center; color: var(--primary); }
        .copy-tag { font-size: 9px; padding: 2px 6px; border: 1px solid var(--primary); border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div id="sky-container"></div>

<div class="main-wrapper">
    <div class="header-title">
        <h1>Ray MB66</h1>
        <div style="font-weight: 800; letter-spacing: 4px; color: #4b5563; font-size: 11px; margin-top: -10px;">MAGIC TOOLS V6.5 GALAXY FINAL</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('extract', this)">⚡ TRÍCH XUẤT</button>
        <button class="tab-btn" onclick="switchTab('compare', this)">🔍 SO SÁNH</button>
    </div>

    <div class="container">
        <div id="modeExtract">
            <div class="search-area">
                <input type="text" id="searchInp" placeholder="Tìm kiếm nhanh dòng dán..." oninput="filterTextarea()">
                <span id="matchCount" style="font-size: 11px; font-weight: 800; color: var(--primary)"></span>
            </div>
            <textarea id="rawText" placeholder="Dán nội dung vào đây..."></textarea>
            <div class="button-row">
                <button class="btn-run" onclick="processExtract()">⚡ PHÂN TÍCH</button>
                <button class="btn-clear" onclick="resetAll('extract')">🧹 LÀM MỚI</button>
                <button class="btn-run" style="background:var(--green)" onclick="exportExcel()">📊 EXCEL</button>
            </div>
            <div id="summaryStats">Sẵn sàng...</div>
            <div class="result-grid">
                <div class="box" style="border-top: 3px solid var(--green)">
                    <div class="box-h" style="color:var(--green)"><span>✅ HỢP LỆ</span> <span class="copy-tag" onclick="copyBox('outValid')">COPY</span></div>
                    <div id="outValid" class="box-b"></div>
                </div>
                <div class="box" style="border-top: 3px solid var(--yellow)">
                    <div class="box-h" style="color:var(--yellow)"><span>❌ SAI ĐỊNH DẠNG</span> <span class="copy-tag" onclick="copyBox('outWrong')">COPY</span></div>
                    <div id="outWrong" class="box-b"></div>
                </div>
                <div class="box" style="border-top: 3px solid var(--red)">
                    <div class="box-h" style="color:var(--red)"><span>🚫 KHÔNG TỪ KHÓA</span> <span class="copy-tag" onclick="copyBox('outNone')">COPY</span></div>
                    <div id="outNone" class="box-b"></div>
                </div>
                <div class="box" style="border-top: 3px solid var(--pink)">
                    <div class="box-h" style="color:var(--pink)"><span>⚠️ HÚT LẶP</span> <span class="copy-tag" onclick="copyBox('outDuplicate')">COPY</span></div>
                    <div id="outDuplicate" class="box-b"></div>
                </div>
            </div>
        </div>

        <div id="modeCompare" class="hidden">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <textarea id="listA" style="min-height: 200px;" placeholder="Danh sách A..."></textarea>
                <textarea id="listB" style="min-height: 200px;" placeholder="Danh sách B..."></textarea>
            </div>
            <div class="button-row">
                <button class="btn-run" onclick="processCompare()">🔍 SO SÁNH</button>
                <button class="btn-clear" onclick="resetAll('compare')">🧹 LÀM MỚI</button>
            </div>
            <div class="result-grid">
                <div class="box" style="border-top: 3px solid var(--green)"><div class="box-h" style="color:var(--green)">✨ TRÙNG KHỚP</div><div id="compMatch" class="box-b"></div></div>
                <div class="box" style="border-top: 3px solid var(--primary)"><div class="box-h" style="color:var(--primary)">🚩 CHỈ CÓ Ở A</div><div id="compOnlyA" class="box-b"></div></div>
                <div class="box" style="border-top: 3px solid var(--accent)"><div class="box-h" style="color:var(--accent)">🚩 CHỈ CÓ Ở B</div><div id="compOnlyB" class="box-b"></div></div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Tạo Mưa sao băng nền
    const sky = document.getElementById('sky-container');
    for(let i=0; i<15; i++) {
        let s = document.createElement('div');
        s.className = 'shooting-star';
        s.style.top = Math.random() * 50 + '%';
        s.style.left = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 5) + 's';
        sky.appendChild(s);
    }

    // 2. Tạo Sao theo chuột
    document.addEventListener('mousemove', (e) => {
        const spark = document.createElement('div');
        spark.className = 'mouse-spark';
        spark.style.left = e.clientX + 'px';
        spark.style.top = e.clientY + 'px';
        const colors = ['#3b82f6', '#6366f1', '#ec4899', '#ffffff'];
        spark.style.background = colors[Math.floor(Math.random() * colors.length)];
        spark.style.boxShadow = `0 0 10px ${spark.style.background}`;
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 800);
    });

    let originalData = "";

    function switchTab(mode, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('modeExtract').classList.toggle('hidden', mode !== 'extract');
        document.getElementById('modeCompare').classList.toggle('hidden', mode !== 'compare');
    }

    function filterTextarea() {
        const area = document.getElementById('rawText');
        if(!originalData) originalData = area.value;
        const inp = document.getElementById('searchInp').value.toLowerCase();
        if(!inp) { area.value = originalData; document.getElementById('matchCount').innerText = ""; return; }
        const filtered = originalData.split('\n').filter(l => l.toLowerCase().includes(inp));
        area.value = filtered.join('\n');
        document.getElementById('matchCount').innerText = `Tìm thấy ${filtered.length} dòng`;
    }

    function processExtract() {
        const input = document.getElementById('rawText').value;
        if(!input.trim()) return;
        const lines = input.split('\n').filter(l => l.trim() !== '');
        let valid = [], wrong = [], none = [], duplicates = [];
        let map = new Map();

        lines.forEach(line => {
            const clean = line.trim().toUpperCase();
            if (!map.has(clean)) map.set(clean, { count: 1, original: line });
            else map.get(clean).count++;
        });

        const rules = [
            { k: "CHUYEN KHOAN", r: /CHUYEN[\s\.]*KHOAN[\s\.]*([A-Z0-9]{6})/i },
            { k: "CHUYEN", r: /CHUYEN[\s\.]*([A-Z0-9]{6})/i },
            { k: "KHOAN", r: /KHOAN[\s\.]*([A-Z0-9]{6})/i },
            { k: "TIEN", r: /TIEN[\s\.]*([A-Z0-9]{6})/i },
            { k: "MAT", r: /MAT[\s\.]*([A-Z0-9]{4}\s[A-Z0-9]{1})/i }, // Rule MAT cách
            { k: "MAT", r: /MAT[\s\.]*([A-Z0-9]{5,6})/i }
        ];

        map.forEach((data, clean) => {
            if (data.count > 1) { duplicates.push(`(${data.count} lần) ${data.original}`); return; }
            let found = false;
            for (let rule of rules) {
                if (rule.k === 'KHOAN' && /CHUYEN/i.test(clean)) continue;
                const match = clean.match(rule.r);
                if (match) { valid.push(`${rule.k} ${match[1].toUpperCase()}`); found = true; break; }
            }
            if (!found) {
                if (/CHUYEN|KHOAN|TIEN|MAT/i.test(clean)) wrong.push(data.original);
                else none.push(data.original);
            }
        });

        document.getElementById('outValid').innerText = valid.join('\n');
        document.getElementById('outWrong').innerText = wrong.join('\n');
        document.getElementById('outNone').innerText = none.join('\n');
        document.getElementById('outDuplicate').innerText = duplicates.join('\n');
        document.getElementById('summaryStats').innerText = `✅: ${valid.length} | ❌: ${wrong.length} | 🚫: ${none.length} | ⚠️: ${duplicates.length}`;
    }

    function processCompare() {
        const a = document.getElementById('listA').value.split('\n').map(x => x.trim().toUpperCase()).filter(x => x !== "");
        const b = document.getElementById('listB').value.split('\n').map(x => x.trim().toUpperCase()).filter(x => x !== "");
        const setA = new Set(a); const setB = new Set(b);
        document.getElementById('compMatch').innerText = [...new Set(a.filter(x => setB.has(x)))].join('\n');
        document.getElementById('compOnlyA').innerText = [...new Set(a.filter(x => !setB.has(x)))].join('\n');
        document.getElementById('compOnlyB').innerText = [...new Set(b.filter(x => !setA.has(x)))].join('\n');
    }

    function copyBox(id) {
        const text = document.getElementById(id).innerText;
        if(!text) return;
        navigator.clipboard.writeText(text).then(() => alert("Đã copy!"));
    }

    function resetAll(mode) {
        if(mode === 'extract') {
            originalData = "";
            ['rawText', 'searchInp', 'outValid', 'outWrong', 'outNone', 'outDuplicate'].forEach(id => {
                const el = document.getElementById(id);
                if(el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') el.value = "";
                else el.innerText = "";
            });
            document.getElementById('matchCount').innerText = "";
        } else {
            ['listA', 'listB', 'compMatch', 'compOnlyA', 'compOnlyB'].forEach(id => {
                const el = document.getElementById(id);
                if(el.tagName === 'TEXTAREA') el.value = "";
                else el.innerText = "";
            });
        }
    }

    function exportExcel() {
        const wb = XLSX.utils.book_new();
        const addS = (name, id) => {
            const lines = document.getElementById(id).innerText.split('\n').map(l => [l]);
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lines), name);
        };
        addS('HỢP LỆ', 'outValid'); addS('SAI', 'outWrong'); addS('KHÔNG TỪ KHÓA', 'outNone'); addS('LẶP', 'outDuplicate');
        XLSX.writeFile(wb, 'Ray_MB66_V6.5.xlsx');
    }

    document.getElementById('rawText').addEventListener('focus', function() {
        if(!document.getElementById('searchInp').value) originalData = this.value;
    });
</script>
</body>
</html>
